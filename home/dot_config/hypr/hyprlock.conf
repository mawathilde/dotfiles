source = $HOME/.cache/wal/colors-hyprland.conf

background {
    monitor =
    path = $HOME/wallpapers/cyberpunk.jpg 
    
    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur = true
    blur_size = 4
    blur_passes = 3
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    position = 0, 60
    valign = bottom
    halign = center
    outline_thickness = 3
    dots_size = 0.2
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
}


label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 80
    position = 0, 200
    halign = center
    valign = center
    shadow = true
}
